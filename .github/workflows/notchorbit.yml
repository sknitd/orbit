name: Build and test NotchOrbit
on:
  push:
    branches: [main, codex/orbitdrop]
    paths:
      - 'NotchOrbit/**'
      - 'Sources/OrbitCore/**'
      - 'Sources/OrbitDrop/AppModel.swift'
      - 'Sources/OrbitDrop/Engines/**'
      - 'Sources/OrbitDrop/WebPBridge.h'
      - 'Scripts/prepare-webp.sh'
      - '.github/workflows/notchorbit.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      NOTCHORBIT_EVAL_DIR: '${{ github.workspace }}/NotchOrbit/build/evaluation'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build tools
        run: command -v cmake || brew install cmake
      - name: Test and build NotchOrbit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p NotchOrbit/build
          {
            swift test --parallel
            bash NotchOrbit/Scripts/build.sh
          } 2>&1 | tee NotchOrbit/build/build.log
      - name: Upload application and evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotchOrbit-macOS-${{ github.sha }}
          path: |
            NotchOrbit/dist/NotchOrbit.app.zip
            NotchOrbit/dist/NotchOrbit.app.zip.sha256
            NotchOrbit/build/build.log
            NotchOrbit/build/launch-smoke.log
            NotchOrbit/build/evaluation/*.png
            NotchOrbit/build/DerivedData/Logs/Test/*.xcresult
      - name: Preserve NotchOrbit result for Git-only retrieval
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d)"
          cp NotchOrbit/build/build.log "$report_dir/build.log" || true
          if [[ -f NotchOrbit/build/launch-smoke.log ]]; then
            cp NotchOrbit/build/launch-smoke.log "$report_dir/"
          fi
          if [[ -d NotchOrbit/build/evaluation ]]; then
            mkdir -p "$report_dir/evaluation"
            cp NotchOrbit/build/evaluation/*.png "$report_dir/evaluation/" || true
          fi
          if [[ -f NotchOrbit/dist/NotchOrbit.app.zip ]]; then
            cp NotchOrbit/dist/NotchOrbit.app.zip NotchOrbit/dist/NotchOrbit.app.zip.sha256 "$report_dir/"
          fi
          python3 - "$report_dir" <<'PY'
          import json, os, pathlib, sys
          pathlib.Path(sys.argv[1], 'build-status.json').write_text(json.dumps({
            'product': 'NotchOrbit', 'source_directory': 'NotchOrbit',
            'outcome': os.environ['BUILD_OUTCOME'], 'source_commit': os.environ['SOURCE_COMMIT'],
            'runner': 'macos-15', 'run_id': os.environ['GITHUB_RUN_ID'],
            'native_notch_drag_acceptance': 'requires interactive Mac validation'
          }, indent=2) + '\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan "codex/notch-builds/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git rm -rf --ignore-unmatch .
          cp -R "$report_dir/"* .
          git add --force build.log build-status.json
          if [[ -f launch-smoke.log ]]; then git add --force launch-smoke.log; fi
          if [[ -d evaluation ]]; then git add --force evaluation; fi
          if [[ -f NotchOrbit.app.zip ]]; then git add --force NotchOrbit.app.zip NotchOrbit.app.zip.sha256; fi
          git commit -m "NotchOrbit build results for ${SOURCE_COMMIT}"
          git push origin HEAD
