 and more. It’s trusted by over 5,000 companies worldwide for booking platforms, tracking systems, visualizations, and analytics applications. \u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan\u003eIts dataset spans more than \u003cstrong\u003e10,000 airports\u003c/strong\u003e, \u003cstrong\u003e19,000 aircraft registrations\u003c/strong\u003e, \u003cstrong\u003e300 aircraft types\u003c/strong\u003e, \u003cstrong\u003e13,000 airlines\u003c/strong\u003e, \u003cstrong\u003e9,000 cities\u003c/strong\u003e, across \u003cstrong\u003e250+ countries\u003c/strong\u003e, including \u003cstrong\u003e500+ aviation-related tax zones.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003ch2\u003eAPI Documentation \u003c/h2\u003e\u003cp\u003eThe Aviationstack API was built to provide a simple way of accessing global aviation data for real-time, historical flights, and future flights, as well as allow customers to tap into an extensive data set of airline routes and other up-to-date aviation-related information. Requests to the REST API are made using a straightforward \u003ccode\u003eHTTP\u003c/code\u003e GET URL structure, and responses are provided in lightweight \u003ccode\u003eJSON\u003c/code\u003e format.\u003c/p\u003e\u003cp\u003eThe following API documentation can be applied to any major programming language and will present general integration guides and explanations around API endpoints, request parameters, and response objects. If you have any unanswered questions, please reach out to the aviationstack support team for assistance.\u003c/p\u003e\u003ch3\u003eAPI Endpoints Summary\u003c/h3\u003e\u003cfigure class=\\\"table\\\"\u003e\u003ctable class=\\\"ck-table-resized\\\"\u003e\u003ccolgroup\u003e\u003ccol /\u003e\u003ccol /\u003e\u003ccol /\u003e\u003c/colgroup\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eEndpoint\u003c/th\u003e\u003cth\u003ePurpose\u003c/th\u003e\u003cth\u003eAvailable With\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/v1/flights\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eReal‑time or historical flights\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ca href=\\\"https://aviationstack.com/signup/free/monthly/?utm_source=DocumentationPage\u0026amp;utm_medium=Referral\\\" rel=\\\"noopener noreferrer\\\" target=\\\"_blank\\\"\u003e\u003cspan\u003eAll Plans\u003c/span\u003e\u003c/a\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/v1/flights?flight_date=\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eHistorical flights data\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ca href=\\\"https://aviationstack.com/signup/basic/monthly/?utm_source=DocumentationPage\u0026amp;utm_medium=Referral\\\" rel=\\\"noopener noreferrer\\\" target=\\\"_blank\\\"\u003e\u003cspan\u003eBasic and above\u003c/span\u003e\u003c/a\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/v1/flight_schedules\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eScheduled and future flights\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ca href=\\\"https://aviationstack.com/signup/basic/monthly/?utm_source=DocumentationPage\u0026amp;utm_medium=Referral\\\" rel=\\\"noopener noreferrer\\\" target=\\\"_blank\\\"\u003e\u003cspan\u003eBasic and above\u003c/span\u003e\u003c/a\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/v1/flightsFuture\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eFuture flight schedule lookup\u003c/td\u003e\u003ctd\u003e\u003cpre\u003e\u003ca href=\\\"https://aviationstack.com/signup/basic/monthly/?utm_source=DocumentationPage\u0026amp;utm_medium=Referral\\\" rel=\\\"noopener noreferrer\\\" target=\\\"_blank\\\"\u003e\u003cspan\u003eBasic and above\u003c/span\u003e\u003c/a\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/v1/routes\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAirline route
